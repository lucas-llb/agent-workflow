## TDD - Test-Driven Development

Follow Red -> Green -> Refactor for every system that can run headlessly:

1. **Red**: write a failing test describing the expected behavior.
2. **Green**: write the minimum code to make it pass.
3. **Refactor**: clean up while keeping the suite green.

Rules:
- Keep simulation logic (state machines, damage math, matchmaking rules, netcode serialization, save formats) decoupled from engine types so it is unit-testable.
- Deterministic systems (prediction, rollback, delta compression) must be covered by tests with fixed seeds.
- Use the test framework already adopted in the project; do not introduce a new one.
- Do not add E2E/behavior tests for purely visual or artistic changes.

