## TDD - Test-Driven Development

Follow the Red -> Green -> Refactor cycle for every gameplay system that can be tested headlessly:

1. **Red**: write a failing Unity Test Framework test (EditMode for pure logic, PlayMode for runtime behavior).
2. **Green**: write the minimum code needed to make it pass.
3. **Refactor**: clean up without breaking the suite.

Rules:
- Keep game logic (damage math, inventory rules, state machines, save serialization) in plain C# classes decoupled from MonoBehaviour so it is unit-testable.
- Use EditMode tests for deterministic logic; reserve PlayMode tests for physics, coroutines, and scene flow.
- Do not write tests for pure visual/art tuning (materials, lighting values, particle look) — those are validated by inspection.
- Use the test assemblies already present in the project; do not introduce a new test framework.

