## First Step: Read the Project

Before any implementation, inspect:

1. **`AGENTS.md` / `CLAUDE.md`** at the root — if present, those directives win over everything here.
2. **Unity version and render pipeline** — `ProjectSettings/ProjectVersion.txt`, and whether the project uses Built-in, URP, or HDRP.
3. **`Packages/manifest.json`** — which packages are already in use (Input System, Cinemachine, Addressables, DOTS/ECS, Netcode, Zenject/VContainer).
4. **Existing folder structure and code style** — mirror how scripts, ScriptableObjects, prefabs, and assembly definitions are already organized.
5. **Target platforms and quality settings** — build targets, scripting backend (Mono vs IL2CPP), and per-platform quality tiers.

> **Core rule:** the best new code looks like it was written by the same person who wrote the existing code. Never introduce a new package, DI container, or architecture pattern that the project does not already use.

